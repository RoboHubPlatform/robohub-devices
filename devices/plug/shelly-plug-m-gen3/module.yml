module:
  name: robohub-device-shelly-plug-m-gen3
  type: driver
  version: 0.1.0
  description: >
    Shelly Plug M Gen3 as a switch and power meter, reached over HTTP JSON-RPC
    or MQTT. Both transports produce the same cached state and power reading.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/shelly_plug.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main
  - name: robohub-http
    type: c
    path: /home/miraur/projects/robohub-devices/protocols/http
  - name: robohub-json
    type: c
    path: /home/miraur/projects/robohub-devices/protocols/json
  - name: robohub-mqtt
    type: c
    path: /home/miraur/projects/robohub-devices/protocols/mqtt

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - robohub/devices/plug/shelly_plug.h
  cmake:
    target: "rho::robohub-device-shelly-plug-m-gen3"
    include_dirs:
      - inc
    link_libraries:
      - rho::robohub-common
      - rho::robohub-http
      - rho::robohub-json
      - rho::robohub-mqtt

package:
  kind: library
  binary: false

device:
  kind: plug
  manufacturer: Shelly
  model: Plug M Gen3
  summary: A Wi-Fi smart plug with a switch and a power meter.
  transports: [http, mqtt]

# What a widget may bind to. The switch is an output a button or a toggle
# drives; the power reading is an input a number, chart or table shows.
signals:
  - id: switch
    label: Switch
    direction: output
    field: state
    kinds: "toggle button"
    summary: The plug's relay, on or off.
  - id: power
    label: Power
    direction: input
    unit: W
    field: power_w
    kinds: "numeric chart table"
    summary: The load the plug is switching, in watts.
  - id: voltage
    label: Voltage
    direction: input
    unit: V
    field: voltage_v
    kinds: "numeric chart table"
    summary: The mains voltage the plug reports.
  - id: current
    label: Current
    direction: input
    unit: A
    field: current_a
    kinds: "numeric chart table"
    summary: The current the plug is switching.
  - id: energy_total
    label: Energy total
    direction: input
    unit: kWh
    field: energy_total_kwh
    kinds: "numeric table"
    summary: The energy the plug has measured in total.

metadata:
  tags: [driver, device, plug, shelly, http, mqtt]
  stability: experimental
  visibility: public

docs:
  title: Shelly Plug M Gen3
  section: devices
  order: "50"
  index: docs/index.md
  sources:
    - docs/index.md

telemetry:
  interface: plug
  http_path: "/rpc/Shelly.GetStatus"
telemetry_http_fields:
  - "switch|state||bool|switch:0/output|1"
  - "power|power_w|W|f32|switch:0/apower|1"
  - "voltage|voltage_v|V|f32|switch:0/voltage|1"
  - "current|current_a|A|f32|switch:0/current|1"
  - "energy_total|energy_total_kwh|kWh|f32|switch:0/aenergy/total|0.001"
