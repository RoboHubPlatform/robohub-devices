module:
  name: robohub-device-growatt-es
  type: driver
  version: 0.1.0
  description: >
    A Growatt hybrid inverter (SPH/ES) read over Modbus RTU. Presents the
    RoboHubInverter device interface; the register map is data so a model whose
    layout differs is a change of map, not of code.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-14"

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/growatt.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main
  - name: robohub-modbus
    type: c
    path: /home/miraur/projects/robohub-devices/protocols/modbus

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - robohub/devices/inverter/growatt.h
  cmake:
    target: "rho::robohub-device-growatt-es"
    include_dirs:
      - inc
    link_libraries:
      - rho::robohub-common
      - rho::robohub-modbus

package:
  kind: library
  binary: false

device:
  kind: inverter
  manufacturer: Growatt
  model: SPH/ES hybrid inverter
  summary: A Growatt hybrid inverter read over Modbus RTU.
  transports: [modbus]

signals:
  - id: pv_power
    label: PV power
    direction: input
    unit: W
    field: pv_power_w
    kinds: "numeric chart table"
  - id: load_power
    label: Load power
    direction: input
    unit: W
    field: load_power_w
    kinds: "numeric chart table"
  - id: grid_power
    label: Grid power
    direction: input
    unit: W
    field: grid_power_w
    kinds: "numeric chart table"
  - id: battery_power
    label: Battery power
    direction: input
    unit: W
    field: battery_power_w
    kinds: "numeric chart table"
  - id: battery_soc
    label: Battery state of charge
    direction: input
    unit: "%"
    field: battery_soc
    kinds: "numeric chart"
  - id: energy_today
    label: Energy today
    direction: input
    unit: kWh
    field: energy_today_kwh
    kinds: "numeric chart table"
  - id: energy_total
    label: Energy total
    direction: input
    unit: kWh
    field: energy_total_kwh
    kinds: "numeric table"

metadata:
  tags:
    - driver
    - device
    - inverter
    - modbus
    - growatt
  stability: experimental
  visibility: public
