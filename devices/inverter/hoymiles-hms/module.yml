module:
  name: robohub-device-hoymiles-hms
  type: driver
  version: 0.1.0
  description: >
    A Hoymiles microinverter read through an OpenDTU over HTTP. Presents the
    RoboHubInverter device interface with the photovoltaic power and energy
    counters the inverter reports.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-14"

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/hoymiles.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main
  - name: robohub-http
    type: c
    path: /home/miraur/projects/robohub-devices/protocols/http
  - name: robohub-json
    type: c
    path: /home/miraur/projects/robohub-devices/protocols/json

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - robohub/devices/inverter/hoymiles.h
  cmake:
    target: "rho::robohub-device-hoymiles-hms"
    include_dirs:
      - inc
    link_libraries:
      - rho::robohub-common
      - rho::robohub-http
      - rho::robohub-json

package:
  kind: library
  binary: false

device:
  kind: inverter
  manufacturer: Hoymiles
  model: HMS microinverter
  summary: A Hoymiles microinverter read through an OpenDTU over HTTP.
  transports: [http]

metadata:
  tags:
    - driver
    - device
    - inverter
    - http
    - hoymiles
    - opendtu
  stability: experimental
  visibility: public

signals:
  - id: pv_power
    label: PV power
    direction: input
    unit: W
    field: pv_power_w
    kinds: "numeric chart table"
  - id: energy_today
    label: Energy today
    direction: input
    unit: kWh
    field: energy_today_kwh
    kinds: "numeric chart table"
  - id: energy_total
    label: Energy total
    direction: input
    unit: kWh
    field: energy_total_kwh
    kinds: "numeric table"

telemetry:
  interface: inverter
  http_path: "/api/livedata/status"
telemetry_http_fields:
  - "pv_power|pv_power_w|W|f32|total/Power/v|1"
  - "energy_today|energy_today_kwh|kWh|f32|total/YieldDay/v|1"
  - "energy_total|energy_total_kwh|kWh|f32|total/YieldTotal/v|1"
