#
# sonoff-zbdongle-e — the Sonoff Zigbee 3.0 USB Dongle Plus V2, as data for Mesh.
#
# A coordinator (ADR-0003): a USB radio Mesh places under a board that can host
# it and drives through Zigbee2MQTT on that board (robohub ADR-0017). The
# manifest says what Mesh needs to place it and start Zigbee2MQTT for it, and
# nothing else; no C code runs it, so there is no build and no package.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: robohub-device-sonoff-zbdongle-e
  id: robohub.device.sonoff-zbdongle-e
  type: device
  version: 0.1.0
  description: >
    Sonoff Zigbee 3.0 USB Dongle Plus V2 (ZBDongle-E, Silicon Labs EFR32MG21), a
    Zigbee coordinator Mesh drives through Zigbee2MQTT's ember adapter. Declared
    as data, with no C driver.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-20"

# The ecosystem the device belongs to, as the collection names it: not a C
# dependency (nothing here is compiled), but what lets a tool find the module
# contract a `device` is written to.
depends:
  - name: robohub-common
    type: c
    path: ${ROBOHUB_WORKSPACE}/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

# A coordinator is reached through the program that drives it, not over a
# transport of its own, so `transports` is empty and `protocol` says what radio
# network it makes.
device:
  kind: coordinator
  manufacturer: SONOFF
  model: ZBDongle-E
  summary: Sonoff Zigbee 3.0 USB Dongle Plus V2 (EFR32MG21), a Zigbee coordinator driven by Zigbee2MQTT.
  protocol: zigbee
  chip: EFR32MG21
  transports: []

# How it appears on a host. Most units carry a WCH CH9102F bridge (1a86:55d4,
# by-id ending -if00); some a Silicon Labs CP210x (10c4:ea60, ending
# -if00-port0), the id the ZBDongle-P has too, which is why the adapter is
# declared below and never inferred from the id. Behind usbipd or a VM the
# by-id name may differ.
usb:
  ids: ["1a86:55d4", "10c4:ea60"]
  by_id:
    - "usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_*-if00"
    - "usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_*-if00-port0"

# What a board must declare to host it: a host to run Zigbee2MQTT on, and a USB
# host port to plug it into.
needs:
  host: true
  usb_host: true

# Zigbee2MQTT's ember adapter speaks EZSP v13 and later, which is EmberZNet 7.4;
# 7.4.4 is the oldest firmware the guide asks for. A dongle on older firmware
# does not start, and the guide says how to flash it.
zigbee:
  adapter: ember
  firmware_min: "EmberZNet 7.4.4"

metadata:
  tags: [device, coordinator, sonoff, zigbee, zigbee2mqtt, usb]
  stability: experimental
  visibility: public

docs:
  title: Sonoff ZBDongle-E (Zigbee coordinator)
  section: devices
  order: "60"
  index: docs/doc/index.md
  sources:
    - docs/doc/index.md
