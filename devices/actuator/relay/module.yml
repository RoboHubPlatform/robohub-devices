module:
  name: robohub-device-relay
  type: driver
  version: 0.1.0
  description: >
    A relay (or any on/off output) over a GPIO, presenting the RoboHubSwitch
    device interface. The primitive a smart plug or any switched load is built
    from.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-16"

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/relay.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - robohub/devices/actuator/relay.h
  cmake:
    target: "rho::robohub-device-relay"
    include_dirs:
      - inc
    link_libraries:
      - rho::robohub-common

package:
  kind: library
  binary: false

metadata:
  tags:
    - driver
    - device
    - actuator
    - switch
    - relay
  stability: experimental
  visibility: public
