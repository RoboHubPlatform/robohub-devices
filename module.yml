#
# robohub-devices — integrations for equipment the ecosystem does not sense.
#
# A collection: what it carries are device integrations and the protocol clients
# they are built on, each a module of its own.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: robohub-devices
  type: collection
  version: 0.2.1
  description: >
    Device integrations for the RoboHub Platform: inverters, meters and other
    equipment spoken to over a protocol of its own, read into the common device
    interfaces and published to a gateway.

# What this repository carries, for a reader and for tooling. A module is built
# and depended on from where it sits.
modules:
  - protocols/modbus
  - protocols/mqtt
  - protocols/http
  - protocols/json
  - runtime/device-node
  - devices/inverter/growatt-es
  - devices/inverter/hoymiles-hms
  - devices/actuator/relay
  - devices/plug/shelly-plug-m-gen3
  - apps/smart-plug
  - nodes/gateway-node
  - tests/smart-plug-node

# The device integrations this collection carries, in the order a device
# picker should offer them. A new device adds its path here as well as its
# folder; a consumer reads this list instead of scanning the tree.
devices:
  - devices/plug/shelly-plug-m-gen3
  - devices/inverter/growatt-es
  - devices/inverter/hoymiles-hms
  - devices/actuator/relay

metadata:
  tags:
    - collection
    - devices
    - inverter
    - modbus
    - http
    - mqtt
    - shelly
  stability: experimental
  visibility: public

docs:
  title: RoboHub Devices
  section: collections
  order: "10"
  index: docs/index.md
  sources:
    - docs/index.md
