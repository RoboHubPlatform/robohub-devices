#
# robohub-devices — integrations for equipment the ecosystem does not sense.
#
# A collection: what it carries are device integrations and the protocol clients
# they are built on, each a module of its own.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: robohub-devices
  id: robohub.collection.devices
  previous_ids:
    - robohub-devices
  type: collection
  version: 0.8.0
  license: "MIT"
  description: >
    Device integrations for the RoboHub Platform: inverters, meters and other
    equipment spoken to over a protocol of its own, read into the common device
    interfaces and published to a gateway.

# The collection's requirements are numbered DEVS-NNNN (and DEVS-<SUB>-NNNN per
# family: protocols, inverters, actuators, plugs, the smart-plug application and
# the device node) and serve the system requirements robohub holds. They are
# kept here, at the root, for every module the collection carries.
requirements: { prefix: DEVS, parent: robohub }

# The interfaces every module in the collection is written against. A
# collection is not built, but it belongs to the ecosystem that declares those
# interfaces, and naming it is what lets a tool recognize the platform and find
# the module contract the ecosystem publishes.
depends:
  - name: robohub-common
    type: c
    path: ../robohub-common

# What this repository carries, for a reader and for tooling. A module is built
# and depended on from where it sits.
modules:
  - protocols/modbus
  - protocols/mqtt
  - protocols/http
  - protocols/json
  - devices/inverter/growatt-es
  - devices/inverter/hoymiles-hms
  - devices/actuator/relay
  - apps/smart-plug
  - devices/plug/shelly-plug-m-gen3
  - devices/plug/sonoff-s60tpf
  - devices/plug/sonoff-s60zbtpf
  - devices/coordinator/sonoff-zbdongle-e
  - devices/coordinator/sonoff-zbdongle-p
  - nodes/gateway-node
  - tests/smart-plug-node

# The device integrations this collection carries, in the order a device
# picker should offer them. A new device adds its path here as well as its
# folder; a consumer reads this list instead of scanning the tree. The
# coordinators come after the plugs: they are the radios Zigbee devices join,
# placed under a board rather than picked as a device (ADR-0003).
devices:
  - devices/plug/shelly-plug-m-gen3
  - devices/plug/sonoff-s60tpf
  - devices/plug/sonoff-s60zbtpf
  - devices/coordinator/sonoff-zbdongle-e
  - devices/coordinator/sonoff-zbdongle-p
  - devices/inverter/growatt-es
  - devices/inverter/hoymiles-hms
  - devices/actuator/relay
  - apps/smart-plug

metadata:
  tags:
    - collection
    - devices
    - inverter
    - modbus
    - http
    - mqtt
    - shelly
    - sonoff
    - tasmota
    - zigbee
    - zigbee2mqtt
    - coordinator
  stability: experimental
  visibility: public

docs:
  title: RoboHub Devices
  section: collections
  order: "10"
  index: docs/doc/index.md
  sources:
    - docs/doc/index.md
