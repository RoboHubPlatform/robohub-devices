module:
  name: robohub-mqtt
  type: middleware
  version: 0.1.0
  description: >
    The MQTT seam a device integration publishes and subscribes through: the
    platform's client is the transport, the device owns the topic and payload.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/mqtt.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - robohub/protocols/mqtt.h
  cmake:
    target: "rho::robohub-mqtt"
    include_dirs:
      - inc
    link_libraries:
      - rho::robohub-common

package:
  kind: library
  binary: false

metadata:
  tags:
    - middleware
    - mqtt
    - network
  stability: experimental
  visibility: public

docs:
  title: MQTT
  section: devices
  order: "60"
  index: docs/index.md
  sources:
    - docs/index.md
